plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = project.group
version = project.version

/*
Build ver thingy:
    Major
    Minor
    Build
    Revision
*/

repositories {
    mavenCentral()
    maven { url 'https://nexus.frengor.com/repository/public/' }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    // implementation(kotlin("stdlib"))
    compileOnly("io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT")
    compileOnly 'com.frengor:ultimateadvancementapi:2.6.0'
    // compileOnly("io.papermc.paper:paper-api:${paperapi}")//1.21.8-R0.1-SNAPSHOT")
}

tasks {
    runServer {
        jvmArgs("-Dcom.mojang.eula.agree=true")
        minecraftVersion("1.21")
    }
}

jar {
    archiveBaseName.set(rootProject.name) // Sets the base name of the JAR
    archiveVersion.set(rootProject.version)       // Sets the version

    // Exclude
    exclude '**/*.md', '**/*.txt', '**META-INF/*.SF', '**/META-INF/*.DSA', '**/META-INF/*.RSA'

    manifest {
        attributes(
//                'Class-Path': 'main',
                'Main-Class': 'org.snow2code.standalone.Main'
        )
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
